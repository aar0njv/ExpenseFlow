apiVersion: v1
kind: Service
metadata:
  name: transaction-db
  namespace: expenseflow
  labels:
    app: transaction-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None
  selector:
    app: transaction-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: transaction-db
  namespace: expenseflow
  labels:
    app: transaction-db
spec:
  serviceName: transaction-db
  replicas: 1
  selector:
    matchLabels:
      app: transaction-db
  template:
    metadata:
      labels:
        app: transaction-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "transaction_user"
            - name: POSTGRES_DB
              value: "transaction_db"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expenseflow-secret
                  key: TRANSACTION_DB_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U transaction_user -d transaction_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U transaction_user -d transaction_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: transaction-db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: transaction-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
