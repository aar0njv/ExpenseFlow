apiVersion: v1
kind: Service
metadata:
  name: report-db
  namespace: expenseflow
  labels:
    app: report-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None
  selector:
    app: report-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: report-db
  namespace: expenseflow
  labels:
    app: report-db
spec:
  serviceName: report-db
  replicas: 1
  selector:
    matchLabels:
      app: report-db
  template:
    metadata:
      labels:
        app: report-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "report_user"
            - name: POSTGRES_DB
              value: "report_db"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expenseflow-secret
                  key: REPORT_DB_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U report_user -d report_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U report_user -d report_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: report-db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: report-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
