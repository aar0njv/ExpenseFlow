# Services: give pods a ClusterIP since pods are ephermeral
# Deployments: manage multiple pod replicas for zero downtime, scaling and auto-healing


apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: expenseflow
  labels:
    app: account-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: account-service

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: expenseflow
  labels:
    app: account-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: account-service
          image: registry.gitlab.com/aar0njv-projects/expenseflow/account-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: expenseflow-secret
                  key: ACCOUNT_DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: expenseflow-secret
                  key: JWT_SECRET_KEY
            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: expenseflow-config
                  key: JWT_ALGORITHM
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: expenseflow-config
                  key: ACCESS_TOKEN_EXPIRE_MINUTES
