stages:
  - test
  - package

default:
  tags:
    - devops
    - docker
    - ubuntu

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

test:services:
  stage: test
  image: python:3.12-slim

  before_script:
    - echo "Installing Poetry..."
    - pip install --no-cache-dir poetry
    - poetry config virtualenvs.create false
  script:
    - echo "Testing account-service..."
    - (cd account-service && poetry lock && poetry install --no-root && PYTHONPATH=. pytest tests/ --cov=app)
    - echo "Testing transaction-service..."
    - (cd transaction-service && poetry lock && poetry install --no-root && PYTHONPATH=. pytest tests/ --cov=app)
    - echo "Testing report-service..."
    - (cd report-service && poetry lock && poetry install --no-root && PYTHONPATH=. pytest tests/ --cov=app)


build-and-push:
  stage: package
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
  before_script:
    - echo "Logging into GitLab Container Registry..."
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
        echo "Logging into Docker Hub..."
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin || echo "WARNING: Docker Hub login failed. Check your DOCKERHUB_USERNAME and DOCKERHUB_TOKEN variables."
      fi
  script:
    # --- Account Service ---
    - echo "Building and pushing account-service..."
    - |
      docker build \
        -t "$CI_REGISTRY_IMAGE/account-service:$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE/account-service:latest" \
        ./account-service
      docker push --all-tags "$CI_REGISTRY_IMAGE/account-service"

      if [ -n "$DOCKERHUB_USERNAME" ]; then
        docker tag "$CI_REGISTRY_IMAGE/account-service:$CI_COMMIT_SHORT_SHA" "$DOCKERHUB_USERNAME/expenseflow-account-service:$CI_COMMIT_SHORT_SHA"
        docker tag "$CI_REGISTRY_IMAGE/account-service:latest" "$DOCKERHUB_USERNAME/expenseflow-account-service:latest"
        docker push --all-tags "$DOCKERHUB_USERNAME/expenseflow-account-service"
      fi

    # --- Transaction Service ---
    - echo "Building and pushing transaction-service..."
    - |
      docker build \
        -t "$CI_REGISTRY_IMAGE/transaction-service:$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE/transaction-service:latest" \
        ./transaction-service
      docker push --all-tags "$CI_REGISTRY_IMAGE/transaction-service"

      if [ -n "$DOCKERHUB_USERNAME" ]; then
        docker tag "$CI_REGISTRY_IMAGE/transaction-service:$CI_COMMIT_SHORT_SHA" "$DOCKERHUB_USERNAME/expenseflow-transaction-service:$CI_COMMIT_SHORT_SHA"
        docker tag "$CI_REGISTRY_IMAGE/transaction-service:latest" "$DOCKERHUB_USERNAME/expenseflow-transaction-service:latest"
        docker push --all-tags "$DOCKERHUB_USERNAME/expenseflow-transaction-service"
      fi

    # --- Report Service ---
    - echo "Building and pushing report-service..."
    - |
      docker build \
        -t "$CI_REGISTRY_IMAGE/report-service:$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE/report-service:latest" \
        ./report-service
      docker push --all-tags "$CI_REGISTRY_IMAGE/report-service"

      if [ -n "$DOCKERHUB_USERNAME" ]; then
        docker tag "$CI_REGISTRY_IMAGE/report-service:$CI_COMMIT_SHORT_SHA" "$DOCKERHUB_USERNAME/expenseflow-report-service:$CI_COMMIT_SHORT_SHA"
        docker tag "$CI_REGISTRY_IMAGE/report-service:latest" "$DOCKERHUB_USERNAME/expenseflow-report-service:latest"
        docker push --all-tags "$DOCKERHUB_USERNAME/expenseflow-report-service"
      fi