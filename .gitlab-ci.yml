workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - test
  - package

default:
  tags:
    - devops
    - docker
    - ubuntu

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"  # for cache mount

test:services:
  stage: test
  parallel:
    matrix:
      - SERVICE: [ account-service, transaction-service, report-service ]
  image: python:3.12-slim

  before_script:
    - echo "Installing Poetry..."
    - pip install --no-cache-dir poetry
    - poetry config virtualenvs.create false
  script:
    - echo "Testing $SERVICE..."
    - (cd $SERVICE && poetry install --no-root && PYTHONPATH=. pytest tests/ --cov=app)


build-and-push:
  stage: package
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
  parallel:
    matrix:
      - SERVICE: [ account-service, transaction-service, report-service ]
    
  before_script:
    - echo "Logging into GitLab Container Registry..."
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
        echo "Logging into Docker Hub..."
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin || echo "WARNING: Docker Hub login failed. Check your DOCKERHUB_USERNAME and DOCKERHUB_TOKEN variables."
      fi
  script:
    - echo "Building and pushing $SERVICE..."
    - docker pull "$CI_REGISTRY_IMAGE/$SERVICE:latest" || true
    - |
      docker build \
        --cache-from "$CI_REGISTRY_IMAGE/$SERVICE:latest" \
        -t "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE/$SERVICE:latest" \
        ./$SERVICE
      docker push --all-tags "$CI_REGISTRY_IMAGE/$SERVICE"

      if [ -n "$DOCKERHUB_USERNAME" ]; then
        docker tag "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA" "$DOCKERHUB_USERNAME/expenseflow-$SERVICE:$CI_COMMIT_SHORT_SHA"
        docker tag "$CI_REGISTRY_IMAGE/$SERVICE:latest" "$DOCKERHUB_USERNAME/expenseflow-$SERVICE:latest"
        docker push --all-tags "$DOCKERHUB_USERNAME/expenseflow-$SERVICE"
      fi