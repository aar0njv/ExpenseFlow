stages:
  - test
  - build-and-push

variables:
  DOCKER_TLS_CERTDIR: "/certs"

test:services:
  stage: test
  image: python:3.12-slim

  before_script:
    - echo "Installing test and service dependencies..."
    - pip install --no-cache-dir -r requirements-test.txt
  script:
    - echo "Running Pytest account-service..."
    - PYTHONPATH=account-service pytest account-service/tests/ --cov=account-service/app
    - echo "Running Pytest transaction-service..."
    - PYTHONPATH=transaction-service pytest transaction-service/tests/ --cov=transaction-service/app
    - echo "Running Pytest report-service..."
    - PYTHONPATH=report-service pytest report-service/tests/ --cov=report-service/app


build-and-push:services:
  stage: build-and-push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "Logging into GitLab Container Registry..."
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
        echo "Logging into Docker Hub..."
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      fi
  script:
    # --- Account Service ---
    - echo "Building and pushing account-service..."
    - |
      if [ -n "$DOCKERHUB_USERNAME" ]; then
        docker build \
          -t "$CI_REGISTRY_IMAGE/account-service:$CI_COMMIT_SHORT_SHA" \
          -t "$CI_REGISTRY_IMAGE/account-service:latest" \
          -t "$DOCKERHUB_USERNAME/expenseflow-account-service:$CI_COMMIT_SHORT_SHA" \
          -t "$DOCKERHUB_USERNAME/expenseflow-account-service:latest" \
          ./account-service
        docker push --all-tags "$CI_REGISTRY_IMAGE/account-service"
        docker push --all-tags "$DOCKERHUB_USERNAME/expenseflow-account-service"
      else
        docker build \
          -t "$CI_REGISTRY_IMAGE/account-service:$CI_COMMIT_SHORT_SHA" \
          -t "$CI_REGISTRY_IMAGE/account-service:latest" \
          ./account-service
        docker push --all-tags "$CI_REGISTRY_IMAGE/account-service"
      fi

    # --- Transaction Service ---
    - echo "Building and pushing transaction-service..."
    - |
      if [ -n "$DOCKERHUB_USERNAME" ]; then
        docker build \
          -t "$CI_REGISTRY_IMAGE/transaction-service:$CI_COMMIT_SHORT_SHA" \
          -t "$CI_REGISTRY_IMAGE/transaction-service:latest" \
          -t "$DOCKERHUB_USERNAME/expenseflow-transaction-service:$CI_COMMIT_SHORT_SHA" \
          -t "$DOCKERHUB_USERNAME/expenseflow-transaction-service:latest" \
          ./transaction-service
        docker push --all-tags "$CI_REGISTRY_IMAGE/transaction-service"
        docker push --all-tags "$DOCKERHUB_USERNAME/expenseflow-transaction-service"
      else
        docker build \
          -t "$CI_REGISTRY_IMAGE/transaction-service:$CI_COMMIT_SHORT_SHA" \
          -t "$CI_REGISTRY_IMAGE/transaction-service:latest" \
          ./transaction-service
        docker push --all-tags "$CI_REGISTRY_IMAGE/transaction-service"
      fi

    # --- Report Service ---
    - echo "Building and pushing report-service..."
    - |
      if [ -n "$DOCKERHUB_USERNAME" ]; then
        docker build \
          -t "$CI_REGISTRY_IMAGE/report-service:$CI_COMMIT_SHORT_SHA" \
          -t "$CI_REGISTRY_IMAGE/report-service:latest" \
          -t "$DOCKERHUB_USERNAME/expenseflow-report-service:$CI_COMMIT_SHORT_SHA" \
          -t "$DOCKERHUB_USERNAME/expenseflow-report-service:latest" \
          ./report-service
        docker push --all-tags "$CI_REGISTRY_IMAGE/report-service"
        docker push --all-tags "$DOCKERHUB_USERNAME/expenseflow-report-service"
      else
        docker build \
          -t "$CI_REGISTRY_IMAGE/report-service:$CI_COMMIT_SHORT_SHA" \
          -t "$CI_REGISTRY_IMAGE/report-service:latest" \
          ./report-service
        docker push --all-tags "$CI_REGISTRY_IMAGE/report-service"
      fi